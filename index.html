<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Protected Portal Access</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            background-color: #f4f6f9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .box {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }
        h2 { margin-top: 0; color: #1a73e8; font-size: 22px; }
        p { color: #666; font-size: 14px; margin-bottom: 20px; }
        input[type="password"] {
            width: 100%;
            padding: 12px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 16px;
            text-align: center;
        }
        button {
            background-color: #1a73e8;
            color: white;
            border: none;
            padding: 12px;
            font-size: 16px;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 15px;
            width: 100%;
            font-weight: bold;
        }
        button:hover { background-color: #155cb4; }
        .result {
            margin-top: 20px;
            padding: 12px;
            border-radius: 6px;
            display: none;
            font-size: 15px;
            word-break: break-all;
            background: #f8f9fa; 
            color: #333; 
            border: 1px solid #dadce0;
            font-family: monospace;
            white-space: pre-wrap;
        }
    </style>
</head>
<body>
    <div class="box">
        <h2>Prompt</h2>
        <p>Enter</p>
        <input type="password" id="userGuess" placeholder="Enter here..." onkeypress="handleKeyPress(event)">
        <button onclick="unlockPortal()">Button</button>
        <div id="statusBox" class="result"></div>
    </div>
    <script>
        const ENCRYPTED_TOKEN = "7jhTyNRoGciXXWgKh-reX3XLgNKwKpkCQ7c4ILnr6ro-ryp-myfpyIBQLgb38KmQjUDUF7HGZbaxk-sGSpww4adNdZb0WXimdZVr8VxgnHcNRxPdpmR5r3OjN1WVSsES8GtAYvOv";

        const ITERATIONS = 100000;
        const HASH_ALGO = 'SHA-256';

        function base64UrlToBuffer(base64Url) {
            let base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
            while (base64.length % 4) { base64 += '='; }
            const binary = atob(base64);
            const bytes = new Uint8Array(binary.length);
            for (let i = 0; i < binary.length; i++) {
                bytes[i] = binary.charCodeAt(i);
            }
            return bytes.buffer;
        }
        async function deriveKey(passwordStr, saltBuffer) {
            const encoder = new TextEncoder();
            const passwordKey = await window.crypto.subtle.importKey(
                'raw', encoder.encode(passwordStr), 'PBKDF2', false, ['deriveKey']
            );
            return window.crypto.subtle.deriveKey(
                { name: 'PBKDF2', salt: saltBuffer, iterations: ITERATIONS, hash: HASH_ALGO },
                passwordKey,
                { name: 'AES-CTR', length: 256 },
                false,
                ['decrypt']
            );
        }
        function handleKeyPress(event) {
            if (event.key === "Enter") {
                unlockPortal();
            }
        }
        async function unlockPortal() {
            const guess = document.getElementById('userGuess').value.trim();
            const statusBox = document.getElementById('statusBox');
            if (!guess) {
                alert('Please enter a code.');
                return;
            }
            try {
                const rawBuffer = base64UrlToBuffer(ENCRYPTED_TOKEN);
                // Unpack CTR payload parameters [Salt (16B)] + [Counter (16B)] + [Ciphertext]
                const salt = rawBuffer.slice(0, 16);
                const counter = rawBuffer.slice(16, 32); 
                const ciphertext = rawBuffer.slice(32);
                const cryptoKey = await deriveKey(guess, new Uint8Array(salt));
                const decrypted = await window.crypto.subtle.decrypt(
                    { name: 'AES-CTR', counter: new Uint8Array(counter), length: 64 },
                    cryptoKey,
                    ciphertext
                );
                const decoder = new TextDecoder();
                const processedOutput = decoder.decode(decrypted);
                statusBox.style.display = "block";
                statusBox.innerText = processedOutput;
            } catch (e) {
                statusBox.style.display = "block";
                statusBox.innerText = "[Processing Error: Unable to compute string values]";
            }
        }
    </script>
</body>
</html>
